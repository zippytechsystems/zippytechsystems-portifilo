name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Package Hostinger production assets & backend
        run: npm run package:hostinger

      - name: 🔍 Check Hostinger FTP credentials
        id: check_ftp
        run: |
          if [ -n "${{ secrets.FTP_SERVER }}" ]; then
            echo "has_ftp=true" >> "$GITHUB_OUTPUT"
            echo "FTP_SERVER secret detected. Deployment step enabled."
          else
            echo "has_ftp=false" >> "$GITHUB_OUTPUT"
            echo "FTP_SERVER secret not set. Deployment step will be skipped."
          fi

      - name: 🚀 Deploy public_html folder to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: steps.check_ftp.outputs.has_ftp == 'true'
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./public_html/
          local-dir: ./hostinger-package/public_html/
          dangerous-clean-slate: false
